<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud-Based Notes Application</title>

    <style>

<body>

    <header>
        <h1>☁️ Cloud-Based Notes Application</h1>
        <p>Create, organize, edit, and manage your notes easily</p>
    </header>

    <main class="container">

        <section class="note-form">
            <h2 id="formHeading">📝 Create a New Note</h2>

            <input
                type="text"
                id="noteTitle"
                placeholder="Enter note title"
                maxlength="100"
            >

            <textarea
                id="noteContent"
                placeholder="Write your note here..."
            ></textarea>

            <div class="button-group">
                <button class="save-btn" id="saveButton">
                    Save Note
                </button>

                <button class="clear-btn" id="clearButton">
                    Clear
                </button>
            </div>
        </section>

        <section>
            <div class="notes-header">
                <h2>My Notes 📚</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search notes..."
                    aria-label="Search notes"
                >
            </div>

            <div class="notes-grid" id="notesGrid"></div>
        </section>

    </main>

    <footer>
        <p>Cloud-Based Notes Application | College Mini Project</p>
    </footer>

    <script>
        const titleInput = document.getElementById("noteTitle");
        const contentInput = document.getElementById("noteContent");
        const saveButton = document.getElementById("saveButton");
        const clearButton = document.getElementById("clearButton");
        const notesGrid = document.getElementById("notesGrid");
        const searchInput = document.getElementById("searchInput");
        const formHeading = document.getElementById("formHeading");

        let notes = [];
        let editingId = null;

        // Load notes saved in this browser.
        try {
            notes = JSON.parse(localStorage.getItem("myNotes")) || [];
        } catch (error) {
            notes = [];
        }

        function saveToBrowser() {
            try {
                localStorage.setItem("myNotes", JSON.stringify(notes));
            } catch (error) {
                alert("Unable to save notes in browser storage.");
            }
        }

        function clearForm() {
            titleInput.value = "";
            contentInput.value = "";
            editingId = null;
            formHeading.textContent = "📝 Create a New Note";
            saveButton.textContent = "Save Note";
        }

        function saveNote() {
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (title === "" || content === "") {
                alert("Please enter both a title and note content.");
                return;
            }

            if (editingId !== null) {
                notes = notes.map(function(note) {
                    if (note.id === editingId) {
                        return {
                            ...note,
                            title: title,
                            content: content,
                            updatedAt: new Date().toLocaleString()
                        };
                    }

                    return note;
                });
            } else {
                notes.unshift({
                    id: Date.now().toString() +
                        Math.random().toString(36).slice(2),
                    title: title,
                    content: content,
                    updatedAt: new Date().toLocaleString()
                });
            }

            saveToBrowser();
            clearForm();
            displayNotes(searchInput.value);
        }

        function editNote(id) {
            const note = notes.find(function(item) {
                return item.id === id;
            });

            if (!note) return;

            titleInput.value = note.title;
            contentInput.value = note.content;
            editingId = id;

            formHeading.textContent = "✏️ Edit Note";
            saveButton.textContent = "Update Note";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function deleteNote(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this note?"
            );

            if (!confirmed) return;

            notes = notes.filter(function(note) {
                return note.id !== id;
            });

            if (editingId === id) {
                clearForm();
            }

            saveToBrowser();
            displayNotes(searchInput.value);
        }

        function displayNotes(searchText = "") {
            notesGrid.innerHTML = "";

            const filteredNotes = notes.filter(function(note) {
                return (
                    note.title.toLowerCase().includes(
                        searchText.toLowerCase()
                    ) ||
                    note.content.toLowerCase().includes(
                        searchText.toLowerCase()
                    )
                );
            });

            if (filteredNotes.length === 0) {
                const message = document.createElement("div");
                message.className = "empty-message";

                message.textContent = searchText
                    ? "No matching notes found."
                    : "No notes available. Create your first note! 📝";

                notesGrid.appendChild(message);
                return;
            }

            filteredNotes.forEach(function(note) {
                const card = document.createElement("article");
                card.className = "note-card";

                const title = document.createElement("h3");
                title.textContent = note.title;

                const content = document.createElement("p");
                content.textContent = note.content;

                const date = document.createElement("div");
                date.className = "note-date";
                date.textContent = "Last updated: " + note.updatedAt;

                const actions = document.createElement("div");
                actions.className = "note-actions";

                const editButton = document.createElement("button");
                editButton.className = "edit-btn";
                editButton.textContent = "✏️ Edit";
                editButton.addEventListener("click", function() {
                    editNote(note.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "🗑️ Delete";
                deleteButton.addEventListener("click", function() {
                    deleteNote(note.id);
                });

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                card.appendChild(title);
                card.appendChild(content);
                card.appendChild(date);
                card.appendChild(actions);

                notesGrid.appendChild(card);
            });
        }

        saveButton.addEventListener("click", saveNote);
        clearButton.addEventListener("click", clearForm);

        searchInput.addEventListener("input", function() {
            displayNotes(searchInput.value);
        });

        displayNotes();
    </script>

</body>
</html>
